<!DOCTYPE html>
<html>

<head>
    <title>Resume Template</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #eee;
            font-family: Arial, sans-serif;
        }

        .resume {
            width: 210mm;
            min-height: 297mm;
            margin: auto;
            background: white;
            padding: 35px;
            box-sizing: border-box;
        }

        .header h1 {
            font-size: 35px;
            margin: 0;
        }

        .header h3 {
            margin: 5px 0;
            color: #555;
        }

        .contact {
            margin-top: 10px;
            line-height: 1.6;
        }

        .section {
            margin-top: 25px;
            page-break-inside: avoid;
            break-inside: avoid;
        }

        .title {
            background: #d9d9d9;
            padding: 8px;
            font-size: 18px;
            font-weight: bold;
        }

        .content {
            padding: 10px 0;
            line-height: 1.6;
        }

        .skills span {
            display: inline-block;
            margin-right: 15px;
        }

        p {
            margin: 6px 0;
        }
        button{
            display:block;
            margin:20px auto;
            padding:10px 30px;
            font-size:16px;
            border:none;
            border-radius:8px;
            background:#1b3556;
            color:#fff;
            cursor:pointer;
        }

        button:hover{
            background:#315b8a;
        }

        .top{
            position: fixed;
            top:20px;
            right: 30px;
            font-size: 30px;
        }
    </style>

</head>

<body>

    <div class="top">
                    <a href="home.html">Home</a>
                </div>

<div class="resume">

    <div class="header">

        <h1 id="name"></h1>

        <h3 id="role"></h3>

        <div class="contact">
            <span id="email"></span><br>

            <span id="phone"></span><br>

            <span id="url"></span><br>

            <span id="location"></span>

        </div>

    </div>


    <div class="section">

        <div class="title">
            SUMMARY
        </div>

        <div class="content" id="objective">

            <p>
                Results-driven and detail-oriented professional seeking an opportunity to contribute my knowledge and grow within an organization.
            </p>

        </div>

    </div>



    <div class="section">

        <div class="title">
            TECHNICAL SKILLS
        </div>

        <div class="content" id="technical">

        </div>

    </div>



    <div class="section">

        <div class="title">
            SOFT SKILLS
        </div>

        <div class="content" id="softskill">

        </div>

    </div>



    <div class="section">

        <div class="title">
            EDUCATION
        </div>

        <div class="content" id="education">

        </div>

    </div>



    <div class="section">

        <div class="title">
            EXPERIENCE
        </div>

        <div class="content" id="experience">

        </div>

    </div>



    <div class="section">

        <div class="title">
            COURSE
        </div>

        <div class="content" id="course">

        </div>

    </div>



    <div class="section">

        <div class="title">
            LANGUAGE
        </div>

        <div class="content" id="language">

        </div>

    </div>



    <div class="section">

        <div class="title">
            PROJECT
        </div>

        <div class="content" id="project">

        </div>

    </div>

</div>
<button onclick="downloadResume()">Download</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script>
    var userfname = localStorage.getItem("fname") || "";
var userlname = localStorage.getItem("lname") || "";
var useremail = localStorage.getItem("mail") || "";
var userphn = localStorage.getItem("num") || "";
var userurl = localStorage.getItem("linkk") || "";
var userlocation = localStorage.getItem("loc") || "";

document.getElementById("name").innerHTML = userfname + " " + userlname;
document.getElementById("role").innerHTML = "Fresher";
document.getElementById("email").innerHTML = useremail;
document.getElementById("phone").innerHTML = userphn;
document.getElementById("url").innerHTML = userurl;
document.getElementById("location").innerHTML = userlocation;

// EDUCATION


var deg = localStorage.getItem("degree") || "";
var clgname = localStorage.getItem("clgname") || "";
var csyear = localStorage.getItem("csyear") || "";
var clyear = localStorage.getItem("clyear") || "";
var cpercent = localStorage.getItem("cpercent") || "";

var school12 = localStorage.getItem("name") || "";
var year12 = localStorage.getItem("year") || "";
var percent12 = localStorage.getItem("percent") || "";

var school10 = localStorage.getItem("sname") || "";
var ssyear = localStorage.getItem("ssyear") || "";
var slyear = localStorage.getItem("slyear") || "";
var spercent = localStorage.getItem("spercent") || "";

if(deg || clgname || csyear || clyear || cpercent ||
   school12 || year12 || percent12 ||
   school10 || ssyear || slyear || spercent){

document.getElementById("education").innerHTML =
"<b>Degree:</b> " + deg + "<br>" +
"<b>College:</b> " + clgname + "<br>" +
"<b>Duration:</b> " + csyear + " - " + clyear + "<br>" +
"<b>Percentage:</b> " + cpercent + "%<br><br>" +

"<b>Higher Secondary (12th)</b><br>" +
"School: " + school12 + "<br>" +
"Year: " + year12 + "<br>" +
"Percentage: " + percent12 + "%<br><br>" +

"<b>SSLC (10th)</b><br>" +
"School: " + school10 + "<br>" +
"Duration: " + ssyear + " - " + slyear + "<br>" +
"Percentage: " + spercent + "%";

}else{
document.getElementById("education").closest(".section").style.display="none";
}


// TECHNICAL SKILLS
var tech = [];

["html","css","javascript","python","sql","othertech"].forEach(function(key){
    var value = localStorage.getItem(key);
    if(value){
        tech.push(value);
    }
});

if(tech.length > 0){
    document.getElementById("technical").innerHTML = tech.join("<br>");
}else{
    document.getElementById("technical").closest(".section").style.display="none";
}


// SOFT SKILLS
var soft = [];

["communication","teamwork","creativity","adaptability","othersoft"].forEach(function(key){
    var value = localStorage.getItem(key);
    if(value){
        soft.push(value);
    }
});

if(soft.length > 0){
    document.getElementById("softskill").innerHTML = soft.join("<br>");
}else{
    document.getElementById("softskill").closest(".section").style.display="none";
}


// LANGUAGES
var language = [];

["tamil","english","hindi","otherlang"].forEach(function(key){
    var value = localStorage.getItem(key);
    if(value){
        language.push(value);
    }
});

if(language.length > 0){
    document.getElementById("language").innerHTML = language.join("<br>");
}else{
    document.getElementById("language").closest(".section").style.display="none";
}


// PROJECT

var proname = localStorage.getItem("proname") || "";
var prodesc = localStorage.getItem("prodesc") || "";
var tool = localStorage.getItem("tool") || "";

if(proname || prodesc || tool){

var project = "";

if(proname){
project += "<b>Project:</b> " + proname + "<br><br>";
}

if(prodesc){
project += "<b>Description:</b><br>" + prodesc + "<br><br>";
}

if(tool){
project += "<b>Tools:</b> " + tool;
}

document.getElementById("project").innerHTML = project;

}else{
document.getElementById("project").closest(".section").style.display="none";
}

// COURSE
var course = localStorage.getItem("course")||"";
if(course){
document.getElementById("course").innerHTML = course;
}else{
document.getElementById("course").closest(".section").style.display="none";
}

//EXPERIENCE
var role = localStorage.getItem("jname") || "";
var company = localStorage.getItem("company") || "";
var duration = localStorage.getItem("duration") || "";
var description = localStorage.getItem("jdescription") || "";

if(role || company || duration || description){

    document.getElementById("experience").innerHTML =
    "<b>" + role + "</b><br>" +
    company + "<br>" +
    duration + "<br><br>" +
    description;

}else{

    document.getElementById("experience").closest(".section").style.display = "none";

}

function downloadResume() {

    const element = document.querySelector(".resume");

    html2pdf().set({
        margin: 5,
        filename: "My_Resume.pdf",
        image: {
            type: "jpeg",
            quality: 1
        },
        html2canvas: {
            scale: 2,
            scrollY: 0,
            useCORS: true
        },
        jsPDF: {
            unit: "mm",
            format: "a4",
            orientation: "portrait"
        },
        pagebreak: {
            mode: ["avoid-all","css","legacy"]
        }
    }).from(element).save();
}

</script>
</body>
</html>
